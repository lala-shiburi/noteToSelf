
name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          envs: SERVER_ENV,CLIENT_ENV,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD

          script: |
            set -eu

            cd ~/noteToSelf

            git pull origin main

            # Restrict permissions on environment files
            umask 077

            # Validate environment variables
            : "${SERVER_ENV:?SERVER_ENV is missing}"
            : "${CLIENT_ENV:?CLIENT_ENV is missing}"
            : "${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is missing}"
            : "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is missing}"

            # Write server environment
            printf '%s' "$SERVER_ENV" > server/.env.tmp
            mv server/.env.tmp server/.env

            # Write client environment
            printf '%s' "$CLIENT_ENV" > client/.env.tmp
            mv client/.env.tmp client/.env


            # Write root .env for docker-compose interpolation
            cat <<EOF > .env.tmp
            MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
            MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
            EOF
            mv .env.tmp .env

            # Rebuild and restart containers
            docker compose down
            docker compose up -d --build
