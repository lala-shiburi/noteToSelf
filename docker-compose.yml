
services:
  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: https://nts.lalacodes.tech
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    container_name: notetoself-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notetoself-frontend.rule=Host(`nts.lalacodes.tech`)"
      - "traefik.http.routers.notetoself-frontend.entrypoints=websecure"
      - "traefik.http.routers.notetoself-frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.notetoself-frontend.priority=10"
      - "traefik.http.services.notetoself-frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - app
      - proxy

  api:
    build:
      context: .
      target: api
    container_name: notetoself-api
    restart: unless-stopped
    env_file:
      - server/.env
    expose:
      - "5000"
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notetoself-api.rule=Host(`nts.lalacodes.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.notetoself-api.entrypoints=websecure"
      - "traefik.http.routers.notetoself-api.tls.certresolver=myresolver"
      - "traefik.http.routers.notetoself-api.priority=100"
      - "traefik.http.services.notetoself-api.loadbalancer.server.port=5000"
      - "traefik.docker.network=proxy"
    networks:
      - app
      - proxy
      - database

  mongodb:
    image: mongo:8.0
    container_name: notetoself-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app:
    driver: bridge

  proxy:
    external: true

  database:
    internal: true

volumes:
  mongodb_data:
