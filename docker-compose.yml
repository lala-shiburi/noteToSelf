services:
  website:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: https://nts.lalacodes.tech
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    container_name: website
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`nts.lalacodes.tech`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls.certresolver=myresolver"
      - "traefik.http.routers.website.priority=10"
      - "traefik.http.services.website.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - app
      - proxy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website-api.rule=Host(`nts.lalacodes.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.website-api.entrypoints=websecure"
      - "traefik.http.routers.website-api.tls.certresolver=myresolver"
      - "traefik.http.routers.website-api.priority=100"
      - "traefik.http.services.website-api.loadbalancer.server.port=5000"
      - "traefik.docker.network=proxy"
    networks:
      - app
      - proxy

networks:
  app:
    driver: bridge
  proxy:
    external: true
